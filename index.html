<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USPUT. — THE LAST MILE</title>
    <style>
        :root{--accent:#e83e8c;--accent-2:#8b5cf6;--bg:#030712;--panel:rgba(15,23,42,0.6);--border:rgba(255,255,255,0.08);--text:#f8fafc;--muted:#94a3b8}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text)}
        body{background:radial-gradient(circle at 25% 30%,rgba(139,92,246,0.08),transparent 45%),radial-gradient(circle at 75% 70%,rgba(232,62,140,0.06),transparent 45%),var(--bg)}
        #stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;max-width:860px;aspect-ratio:4/3;z-index:1}
        canvas{width:100%;height:100%;display:block;background:#020617;border:1px solid var(--border);border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 30px 80px rgba(0,0,0,0.8),0 0 60px rgba(232,62,140,0.15)}
        #ui{position:fixed;inset:0;pointer-events:none;z-index:10;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
        .hud{display:flex;flex-direction:column;gap:10px}
        .hud-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);padding:9px 16px;border-radius:12px;backdrop-filter:blur(10px);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
        .hud-item .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-right:6px}
        .hud-item .value{font-weight:700;color:var(--accent);font-size:14px}
        .prompt{margin-top:6px;background:rgba(15,23,42,0.8);border:1px solid var(--border);padding:7px 14px;border-radius:10px;font-size:12px;color:var(--muted);max-width:fit-content}
        .notification{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-12px);background:rgba(15,23,42,0.9);border:1px solid var(--border);border-left:4px solid var(--accent-2);padding:12px 20px;border-radius:12px;color:var(--text);font-size:13px;min-width:200px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:30;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
        .notification.show{opacity:1;transform:translateX(-50%) translateY(0)}
        .overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(3,7,18,0.72);backdrop-filter:blur(5px)}
        .panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:32px 40px;width:90%;max-width:440px;color:var(--text);text-align:center;box-shadow:0 25px 70px rgba(0,0,0,0.7);position:relative;animation:panelIn .28s ease}
        @keyframes panelIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
        .panel h1{font-size:36px;margin-bottom:6px;letter-spacing:-.5px;background:linear-gradient(to right,#fff,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .panel h2{font-size:22px;margin-bottom:8px;color:var(--accent)}
        .panel p{color:var(--muted);margin-bottom:26px;font-size:14px}
        .btn-row{display:flex;flex-direction:column;gap:11px}
        .btn{background:linear-gradient(135deg,var(--accent),#be185d);border:none;color:#fff;padding:12px 20px;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}
        .btn:hover{transform:translateY(-2px);filter:brightness(1.15);box-shadow:0 10px 24px rgba(232,62,140,0.35)}
        .btn:active{transform:translateY(0)}
        .btn.secondary{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted)}
        .btn.secondary:hover{background:rgba(255,255,255,0.12);color:var(--text)}
        .divider{height:1px;background:var(--border);margin:20px 0}
        .list{text-align:left;margin-top:10px;max-height:250px;overflow-y:auto}
        .list-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
        .list-item .title{font-weight:700;color:var(--accent)}
        .list-item .desc{color:var(--muted);font-size:12px;margin-top:4px}
        #map-panel .panel{text-align:left;padding:24px 28px;max-width:520px}
    </style>
</head>
<body>
<div id="stage"><canvas id="gameCanvas"></canvas></div>
<div id="ui">
    <div class="hud">
        <div class="hud-item"><span class="label">MISIJA</span><span class="value" id="missionText">—</span></div>
        <div class="hud-item"><span class="label">CIJEL</span><span class="value" id="destinationText">—</span></div>
        <div class="hud-item"><span class="label">PAKET</span><span class="value" id="parcelStatus">—</span></div>
        <div class="hud-item"><span class="label">LOKACIJA</span><span class="value" id="locationText">Grad</span></div>
        <div class="prompt" id="promptText">—</div>
    </div>
    <div class="notification" id="notification">—</div>
</div>
<div class="overlay" id="main-menu" style="display:flex;">
    <div class="panel"><h1>USPUT.</h1><p>THE LAST MILE</p>
        <div class="btn-row"><button class="btn" onclick="startGame()">IGRAJ</button><button class="btn secondary" onclick="showCredits()">O IGRI</button></div>
    </div>
</div>
<div class="overlay" id="pause-menu">
    <div class="panel"><h2>PAUZA</h2>
        <div class="btn-row"><button class="btn" onclick="resumeGame()">NASTAVI</button><button class="btn" onclick="openMap()">MAPA</button><button class="btn" onclick="openMissions()">MISIJE</button><button class="btn secondary" onclick="toMainMenu()">GLAVNI MENI</button></div>
    </div>
</div>
<div class="overlay" id="map-panel">
    <div class="panel"><h2 style="display:inline;margin-right:auto;">MAPA</h2><button class="btn secondary" onclick="closeMap()" style="float:right;padding:7px 14px;font-size:13px;">ZATVORI</button>
        <div style="clear:both;margin-top:12px;font-size:12px;color:var(--muted);"><span style="color:var(--accent)">■</span> USPUT. stanica&nbsp;·&nbsp;<span style="color:#fbbf24">■</span> cilj misije&nbsp;·&nbsp;<span style="color:#fff">■</span> vi</div>
        <div style="margin-top:10px;"><canvas id="mapCanvas" width="340" height="240" style="width:100%;height:auto;border:1px solid var(--border);border-radius:10px;background:#020617;"></canvas></div>
    </div>
</div>
<div class="overlay" id="missions-panel">
    <div class="panel"><h2>MISIJE</h2><div id="missions-list" class="list"></div><div class="divider"></div><button class="btn secondary" onclick="closeMissions()">ZATVORI</button></div>
</div>
<div class="overlay" id="credits-panel">
    <div class="panel"><h2>O IGRI</h2><p>USPUT. — The Last Mile<br>Konceptna urbana mobilna igra</p>
        <div class="divider"></div><div style="font-size:12px;color:var(--muted);text-align:left;">W / strelice — kretanje<br>Shift — trčanje<br>E — interakcija<br>Tab — misije · M — mapa<br>Esc — pauza</div>
        <button class="btn secondary" onclick="hideCredits()">NAZAD</button>
    </div>
</div>
<script>
const CONFIG={tileSize:32,mapWidth:25,mapHeight:18,playerSpeed:1.5,sprintMultiplier:1.8,friction:0.9,interactionDistance:48,notificationDuration:3000};
class World{constructor(ctx){this.ctx=ctx;this.tileSize=CONFIG.tileSize;this.grid=this.generateMap();this.entities=[];this.stations=[]}generateMap(){const grid=[];for(let y=0;y<CONFIG.mapHeight;y++){grid[y]=[];for(let x=0;x<CONFIG.mapWidth;x++){let type=0;if(y<3||y>CONFIG.mapHeight-4)type=1;else if(x<3||x>CONFIG.mapWidth-4)type=1;else{const r=Math.random();if(r<0.5)type=1;else if(r<0.7)type=2;else if(r<0.8)type=3;else type=0}grid[y][x]=type}}return grid}isSolid(x,y){const gx=Math.floor(x/this.tileSize),gy=Math.floor(y/this.tileSize);if(gx<0||gx>=CONFIG.mapWidth||gy<0||gy>=CONFIG.mapHeight)return true;return this.grid[gy][gx]===1}draw(){const w=this.ctx.canvas.width,h=this.ctx.canvas.height;this.ctx.fillStyle='#0b1020';this.ctx.fillRect(0,0,w,h);for(let y=0;y<CONFIG.mapHeight;y++){for(let x=0;x<CONFIG.mapWidth;x++){const type=this.grid[y][x],sx=x*this.tileSize,sy=y*this.tileSize;if(type===1){this.ctx.fillStyle='#1e293b';this.ctx.fillRect(sx,sy,this.tileSize,this.tileSize);this.ctx.strokeStyle='#334155';this.ctx.lineWidth=1;this.ctx.strokeRect(sx,sy,this.tileSize,this.tileSize);this.ctx.fillStyle='#475569';this.ctx.fillRect(sx+3,sy+3,this.tileSize-6,this.tileSize-6)}else if(type===2){this.ctx.fillStyle='#14532d';this.ctx.fillRect(sx,sy,this.tileSize,this.tileSize);this.ctx.fillStyle='#16a34a';this.ctx.fillRect(sx+6,sy+6,this.tileSize-12,this.tileSize-12)}else if(type===3){this.ctx.fillStyle='#15803d';this.ctx.fillRect(sx,sy,this.tileSize,this.tileSize);this.ctx.fillStyle='#22c55e';this.ctx.fillRect(sx+6,sy+6,this.tileSize-12,this.tileSize-12)}else{this.ctx.fillStyle='#0f172a';this.ctx.fillRect(sx,sy,this.tileSize,this.tileSize)}}}}}
class Player{constructor(x,y){this.x=x;this.y=y;this.targetX=x;this.targetY=y;this.width=24;this.height=32;this.speed=CONFIG.playerSpeed;this.velocityX=0;this.velocityY=0;this.direction='down';this.isMoving=false;this.isSprinting=false;this.currentAnimFrame=0;this.animTimer=0}init(){this.x=CONFIG.tileSize*3;this.y=CONFIG.tileSize*3;this.targetX=this.x;this.targetY=this.y}update(dt){if(this.isMoving){const dx=this.targetX-this.x,dy=this.targetY-this.y,d=Math.sqrt(dx*dx+dy*dy);if(d>this.speed*dt){this.x+=(dx/d)*this.speed*dt;this.y+=(dy/d)*this.speed*dt;this.isMoving=true}else{this.x=this.targetX;this.y=this.targetY;this.isMoving=false}if(Math.abs(dx)>Math.abs(dy))this.direction=dx>0?'right':'left';else this.direction=dy>0?'down':'up'}this.animTimer+=dt;if(this.animTimer>100&&this.isMoving){this.currentAnimFrame=(this.currentAnimFrame+1)%4;this.animTimer=0}}startMoving(d){const ts=CONFIG.tileSize;let nx=this.x,ny=this.y;switch(d){case'up':ny-=ts;break;case'down':ny+=ts;break;case'left':nx-=ts;break;case'right':nx+=ts;break}if(!this.isPositionBlocked(nx,ny)){this.targetX=nx;this.targetY=ny;this.isMoving=true}}isPositionBlocked(x,y){const hw=this.width/2,hh=this.height/2;const c=[{x:x-hw,y:y-hh},{x:x+hw,y:y-hh},{x:x-hw,y:y+hh},{x:x+hw,y:y+hh}];return c.some(c=>world.isSolid(c.x,c.y))}startSprinting(){this.isSprinting=true}stopSprinting(){this.isSprinting=false}draw(ctx){ctx.save();ctx.translate(this.x+this.width/2,this.y+this.height/2);const grad=ctx.createLinearGradient(-this.width/2,-this.height/2,this.width/2,this.height/2);const color=this.isSprinting?'#be185d':'#e83e8c';grad.addColorStop(0,color);grad.addColorStop(1,'#8b5cf6');ctx.fillStyle=grad;ctx.shadowColor=color;ctx.shadowBlur=this.isSprinting?20:12;ctx.fillRect(-this.width/2,-this.height/2,this.width,this.height);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();const as=this.width/3;switch(this.direction){case'up':ctx.moveTo(0,-this.height/2);ctx.lineTo(as,this.height/2);ctx.lineTo(-as,this.height/2);break;case'down':ctx.moveTo(0,this.height/2);ctx.lineTo(as,-this.height/2);ctx.lineTo(-as,-this.height/2);break;case'left':ctx.moveTo(-this.width/2,0);ctx.lineTo(this.width/2,as);ctx.lineTo(this.width/2,-as);break;case'right':ctx.moveTo(this.width/2,0);ctx.lineTo(-as,as);ctx.lineTo(-as,-as);break}ctx.fill();ctx.restore()}}
class NPC{constructor(x,y,type){this.x=x;this.y=y;this.targetX=x;this.targetY=y;this.width=24;this.height=32;this.type=type;this.direction='down';this.isMoving=false;this.speed=1.0;this.dialogueLines=this.getDialogue();this.interactionDistance=48;this.animTimer=0}getDialogue(){const d={resident:["Nice weather today.","I need to go to the market.","Have you tried the bakery?","The bus stop is over there."],shopkeeper:["Welcome! We have fresh bread.","Don't forget the USPUT. station nearby.","We have groceries and snacks.","Thank you for visiting."],friend:["Want to walk to the park?","I'm heading to the bus stop.","Did you get the parcel?","Let's meet at the café later."],pedestrian:["Just walking around.","Running late for an appointment.","Enjoying the city view.","On my way home."]};return d[this.type]||d.pedestrian}update(dt){this.animTimer=(this.animTimer||0)+dt;if(this.animTimer>2000&&!this.isMoving){const directions=['up','down','left','right'],dir=directions[Math.floor(Math.random()*directions.length)];this.startMovingNPC(dir);this.animTimer=0}}startMovingNPC(d){const ts=CONFIG.tileSize;let nx=this.x,ny=this.y;switch(d){case'up':ny-=ts;break;case'down':ny+=ts;break;case'left':nx-=ts;break;case'right':nx+=ts;break}const c=[{x:nx-this.width/2,y:ny-this.height/2},{x:nx+this.width/2,y:ny-this.height/2},{x:nx-this.width/2,y:ny+this.height/2},{x:nx+this.width/2,y:ny+this.height/2}];if(!c.some(c=>world.isSolid(c.x,c.y))){this.targetX=nx;this.targetY=ny;this.isMoving=true;this.direction=d}}draw(ctx){const colors={resident:'#3b82f6',shopkeeper:'#ef4444',friend:'#22c55e',pedestrian:'#94a3b8'};const color=colors[this.type]||'#94a3b8';ctx.save();ctx.translate(this.x+this.width/2,this.y+this.height/2);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=10;ctx.fillRect(-this.width/2,-this.height/2,this.width,this.height);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();const as=this.width/3;switch(this.direction){case'up':ctx.moveTo(0,-this.height/2);ctx.lineTo(as,this.height/2);ctx.lineTo(-as,this.height/2);break;case'down':ctx.moveTo(0,this.height/2);ctx.lineTo(as,-this.height/2);ctx.lineTo(-as,-this.height/2);break;case'left':ctx.moveTo(-this.width/2,0);ctx.lineTo(this.width/2,as);ctx.lineTo(this.width/2,-as);break;case'right':ctx.moveTo(this.width/2,0);ctx.lineTo(-as,as);ctx.lineTo(-as,-as);break}ctx.fill();ctx.restore()}}
class Mission{constructor(title,description,destination,reward){this.title=title;this.description=description;this.destination=destination;this.status='active';this.completed=false;this.objectives=[];this.reward=reward||0;this.progress=0}addObjective(d){this.objectives.push({description:d,completed:false})}checkCompletion(player){if(this.completed)return false;const dx=player.x-this.destination.x,dy=player.y-this.destination.y,d=Math.sqrt(dx*dx+dy*dy);if(d<64){this.completed=true;this.status='completed';return true}return false}}
class MissionSystem{constructor(){this.missions=[];this.completedToday=[]}generateMission(){const types=[{title:'Posjeti Pekaru',description:'Idi u lokalni pekaru za svježim kruhem.',dx:200,dy:150},{title:'Sastanak s Prijateljem',description:'Seksi se s prijateljem u parku.',dx:350,dy:200},{title:'Idi u Školu',description:'Putuj u školu u sljedećoj komšiji.',dx:100,dy:100},{title:'Posjeti Komšiju',description:'Posjeti svog komšiju napротив ulice.',dx:250,dy:300},{title:'Prihvati Paket',description:'Preuzmi paket na USPUT. sakupljačkoj točki tijekom putovanja.',dx:180,dy:250}];const t=types[Math.floor(Math.random()*types.length)];const m=new Mission(t.title,t.description,{x:t.dx,y:t.dy},Math.floor(Math.random()*50)+10);this.missions.push(m);return m}completeMission(m){m.status='completed';this.completedToday.push(m.title);showNotification('Misija dovršena: '+m.title);return m.reward}}
class Parcel{constructor(id,type,recipient){this.id=id;this.type=type;this.recipient=recipient;this.status='available';this.collectionPoint=null;this.collectionCode=Math.floor(100000+Math.random()*900000)}}
class USPUTStation{constructor(x,y){this.x=x;this.y=y;this.width=64;this.height=64;this.compartments=4;this.occupiedCompartments=0;this.parcels=[];this.stationId=Math.floor(1000+Math.random()*9000)}addParcel(p){this.parcels.push(p);this.occupiedCompartments=Math.min(this.compartments,this.occupiedCompartments+1)}collectParcel(){if(this.parcels.length===0){showNotification('Nema paketa na ovoj stanici.');return null}const p=this.parcels.shift();this.occupiedCompartments=Math.max(0,this.occupiedCompartments-1);p.status='collected';showNotification('Prikupljen paket: '+p.type);particleSystem.emit(this.x+this.width/2,this.y+this.height/2,15,'#e83e8c');return p}draw(ctx){const sx=this.x,sy=this.y;ctx.save();ctx.translate(sx+this.width/2,sy+this.height/2);ctx.fillStyle='#2d3748';ctx.fillRect(-this.width/2,-this.height/2,this.width,this.height);ctx.fillStyle='#e83e8c';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('USPUT.',0,-this.height/2+20);ctx.fillStyle='#4a5568';const cw=this.width/this.compartments;for(let i=0;i<this.compartments;i++){const cx=-this.width/2+i*cw;ctx.fillRect(cx,-this.height/3+10,cw-4,this.height/3-10);if(this.parcels.length>0&&i<this.parcels.length){ctx.fillStyle='#e53e3e';ctx.fillRect(cx+4,-this.height/3+14,cw-8,this.height/3-18)}}ctx.fillStyle='#e83e8c';ctx.fillRect(-this.width/2,this.height/2-20,this.width,20);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText('Stanica #'+this.stationId,0,this.height/2-10);ctx.restore()}}
class Particle{constructor(x,y,color,velocity){this.x=x;this.y=y;this.color=color;this.velocity=velocity||{x:(Math.random()-0.5)*2,y:(Math.random()-0.5)*2};this.life=1;this.decay=0.01+Math.random()*0.01;this.size=4+Math.random()*4}update(dt){this.x+=this.velocity.x;this.y+=this.velocity.y;this.life-=this.decay;this.velocity.x*=0.98;this.velocity.y*=0.98}draw(ctx){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size*this.life,0,Math.PI*2);ctx.fill();ctx.restore()}}
class ParticleSystem{constructor(){this.particles=[]}emit(x,y,count,color){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=0.5+Math.random();this.particles.push(new Particle(x,y,color,{x:Math.cos(a)*s,y:Math.sin(a)*s}))}}update(dt){this.particles=this.particles.filter(p=>p.life>0);this.particles.forEach(p=>p.update(dt))}draw(ctx){this.particles.forEach(p=>p.draw(ctx))}}
class AudioManager{constructor(){this.context=null;this.musicVolume=0.5;this.sfxVolume=0.7;this.init()}init(){try{this.context=new(window.AudioContext||window.webkitAudioContext)()}catch(e){console.warn('Web Audio API not supported')}}playFootstep(d){if(!this.context)return;const o=this.context.createOscillator(),g=this.context.createGain();o.type='sine';o.frequency.value=d==='up'?440:d==='down'?330:d==='left'?294:261;o.frequency.value*=0.5+Math.random()*0.3;g.gain.value=this.sfxVolume*0.1;o.connect(g);g.connect(this.context.destination);o.start();setTimeout(()=>o.stop(),100)}playInteraction(){if(!this.context)return;const o=this.context.createOscillator(),g=this.context.createGain();o.type='triangle';o.frequency.value=523+Math.random()*100;g.gain.value=this.sfxVolume*0.2;o.connect(g);g.connect(this.context.destination);o.start();setTimeout(()=>o.stop(),150)}playParcelPickup(){if(!this.context)return;const o=this.context.createOscillator(),g=this.context.createGain(),f=this.context.createBiquadFilter();o.type='sine';o.frequency.value=659;f.type='lowpass';f.frequency.value=1000;g.gain.value=this.sfxVolume*0.15;o.connect(f);f.connect(g);g.connect(this.context.destination);o.start();setTimeout(()=>o.stop(),200)}playMissionComplete(){if(!this.context)return;const o=this.context.createOscillator(),g=this.context.createGain();o.type='sine';o.frequency.value=440;g.gain.value=this.sfxVolume*0.3;o.connect(g);g.connect(this.context.destination);o.start();setTimeout(()=>o.stop(),500)}}
class WeatherSystem{constructor(){this.weather='clear';this.rainParticles=[];this.lastWeatherChange=0;this.weatherChangeInterval=15000}update(dt){this.lastWeatherChange+=dt;if(this.lastWeatherChange>this.weatherChangeInterval){this.weather=['clear','cloudy','rainy'][Math.floor(Math.random()*3)];this.lastWeatherChange=0}if(this.weather==='rainy'){if(Math.random()<0.01)this.rainParticles.push({x:Math.random()*800,y:Math.random()*600,length:5+Math.random()*5,speed:2+Math.random()*2});this.rainParticles=this.rainParticles.filter(p=>p.y<600);this.rainParticles.forEach(p=>{p.y+=p.speed})}else this.rainParticles=[]}draw(ctx){if(this.weather==='rainy'){ctx.fillStyle='#4a90e2';this.rainParticles.forEach(p=>{ctx.fillRect(p.x,p.y,1,p.length)})}}}

const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),mapCanvas=document.getElementById('mapCanvas'),mapCtx=mapCanvas.getContext('2d');
canvas.width=800;canvas.height=600;
let gameState='menu',world,player,npcs=[],stations=[],missionSystem,particleSystem,audio,weather,lastTime=0,animFrame,collectedParcel=null,keys={},lastMoveTime=0,MOVE_INTERVAL=150;
const $=id=>document.getElementById(id);
function showNotification(t){const n=$('notification');n.textContent=t;n.className='notification';n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),CONFIG.notificationDuration)}
function updateHUD(){const active=missionSystem.missions.find(m=>m.status==='active');$('missionText').textContent=active?active.title:'—';$('destinationText').textContent=active?'('+active.destination.x+', '+active.destination.y+')':'—';$('parcelStatus').textContent=collectedParcel?collectedParcel.type:'—';let nearby=false;const cx=player.x+player.width/2,cy=player.y+player.height/2;for(const s of stations){if(Math.hypot(cx-(s.x+s.width/2),cy-(s.y+s.height/2))<CONFIG.interactionDistance){nearby=true;break}}if(!nearby)for(const n of npcs){if(Math.hypot(cx-(n.x+n.width/2),cy-(n.y+n.height/2))<CONFIG.interactionDistance){nearby=true;break}}$('promptText').textContent=nearby?'E — INTERAKCIJA':'—'}
function initGame(){world=new World(ctx);player=new Player(CONFIG.tileSize*3,CONFIG.tileSize*3);player.init();missionSystem=new MissionSystem();particleSystem=new ParticleSystem();audio=new AudioManager();weather=new WeatherSystem();collectedParcel=null;window.world=world;window.particleSystem=particleSystem;npcs=[new NPC(200,150,'resident'),new NPC(420,300,'shopkeeper'),new NPC(560,180,'friend'),new NPC(300,430,'pedestrian')];stations=[new USPUTStation(160,220),new USPUTStation(600,400),new USPUTStation(380,460)];stations[0].addParcel(new Parcel(1,'Grocery','Marko'));stations[1].addParcel(new Parcel(2,'Documents','Ana'));stations[2].addParcel(new Parcel(3,'Gift','Sara'));missionSystem.generateMission();updateHUD()}
function interact(){const cx=player.x+player.width/2,cy=player.y+player.height/2;for(const s of stations){if(Math.hypot(cx-(s.x+s.width/2),cy-(s.y+s.height/2))<CONFIG.interactionDistance){const p=s.collectParcel();if(p){collectedParcel=p;audio.playParcelPickup();showNotification('Paket prikupljen: '+p.type)}else{audio.playInteraction();showNotification('Nema paketa na ovoj stanici.')}updateHUD();return}}for(const n of npcs){if(Math.hypot(cx-(n.x+n.width/2),cy-(n.y+n.height/2))<CONFIG.interactionDistance){const line=n.dialogueLines[Math.floor(Math.random()*n.dialogueLines.length)];audio.playInteraction();showNotification(n.type+': "'+line+'"');return}}audio.playInteraction()}
function checkMissions(){const active=missionSystem.missions.find(m=>m.status==='active');if(!active)return;if(active.checkCompletion(player)){missionSystem.completeMission(active);audio.playMissionComplete();showNotification('Misija dovršena: '+active.title);collectedParcel=null;updateHUD();setTimeout(()=>missionSystem.generateMission(),1400)}}
function handleMovement(now){if(player.isMoving)return;if(now-lastMoveTime<MOVE_INTERVAL)return;let dir=null;if(keys['ArrowUp']||keys['KeyW'])dir='up';else if(keys['ArrowDown']||keys['KeyS'])dir='down';else if(keys['ArrowLeft']||keys['KeyA'])dir='left';else if(keys['ArrowRight']||keys['KeyD'])dir='right';if(dir){player.startMoving(dir);audio.playFootstep(dir);lastMoveTime=now}}
function update(dt){weather.update(dt);particleSystem.update(dt);player.update(dt);for(const n of npcs)n.update(dt);checkMissions();updateHUD()}
function drawMapView(){ctx.fillStyle='#020617';ctx.fillRect(0,0,canvas.width,canvas.height);const scale=2.6,ox=60,oy=60;for(let y=0;y<CONFIG.mapHeight;y++){for(let x=0;x<CONFIG.mapWidth;x++){const t=world.grid[y][x];if(t===0)continue;ctx.fillStyle=t===1?'#334155':t===2?'#166534':'#22c55e';ctx.fillRect(ox+x*scale,oy+y*scale,scale-1,scale-1)}}ctx.fillStyle='#e83e8c';for(const s of stations)ctx.fillRect(ox+(s.x/CONFIG.tileSize)*scale,oy+(s.y/CONFIG.tileSize)*scale,scale*2.2,scale*2.2);const active=missionSystem.missions.find(m=>m.status==='active');if(active){ctx.fillStyle='#fbbf24';ctx.fillRect(ox+(active.destination.x/CONFIG.tileSize)*scale-2,oy+(active.destination.y/CONFIG.tileSize)*scale-2,5,5)}ctx.fillStyle='#fff';ctx.fillRect(ox+(player.x/CONFIG.tileSize)*scale-1.5,oy+(player.y/CONFIG.tileSize)*scale-1.5,3.5,3.5);ctx.font='bold 14px Segoe UI';ctx.fillStyle='#fff';ctx.fillText('MAPA — X ili klik vanje za zatvaranje',ox,oy-14);ctx.fillStyle='#94a3b8';ctx.font='12px Segoe UI';ctx.fillText('Pinka = USPUT.   Žuta = cilj   Bijelo = vi',ox,canvas.height-24)}
function draw(){if(gameState==='map'){drawMapView();return}world.draw();weather.draw(ctx);for(const s of stations)s.draw(ctx);for(const n of npcs)n.draw(ctx);player.draw(ctx);particleSystem.draw(ctx)}
function loop(now){const dt=now-lastTime;lastTime=now;if(gameState==='playing'){update(dt);handleMovement(now)}draw();animFrame=requestAnimationFrame(loop)}
function startGame(){$('main-menu').style.display='none';$('pause-menu').style.display='none';$('map-panel').style.display='none';$('missions-panel').style.display='none';$('credits-panel').style.display='none';gameState='playing';initGame();audio.context?.resume();lastTime=performance.now();cancelAnimationFrame(animFrame);requestAnimationFrame(loop)}
function showCredits(){$('main-menu').style.display='none';$('credits-panel').style.display='flex'}
function hideCredits(){$('credits-panel').style.display='none';$('main-menu').style.display='flex'}
function resumeGame(){$('pause-menu').style.display='none';gameState='playing';lastTime=performance.now()}
function toMainMenu(){cancelAnimationFrame(animFrame);$('pause-menu').style.display='none';$('map-panel').style.display='none';$('missions-panel').style.display='none';gameState='menu';$('main-menu').style.display='flex'}
function openMap(){if(gameState!=='playing')return;gameState='map';$('pause-menu').style.display='none';$('map-panel').style.display='flex'}
function closeMap(){$('map-panel').style.display='none';gameState='playing';lastTime=performance.now()}
function openMissions(){if(gameState!=='playing')return;renderMissions();gameState='missions';$('pause-menu').style.display='none';$('missions-panel').style.display='flex'}
function closeMissions(){$('missions-panel').style.display='none';gameState='playing';lastTime=performance.now()}
function renderMissions(){const list=$('missions-list');list.innerHTML='';if(missionSystem.missions.length===0){list.innerHTML='<div class="list-item">Nema aktivnih misija.</div>';return}for(const m of missionSystem.missions){const div=document.createElement('div');div.className='list-item'+(m.status==='active'?' active':'');div.innerHTML='<div><div class="title">'+m.title+'</div><div class="desc">'+m.description+'</div></div><div style="color:var(--muted);font-size:11px;">'+(m.status==='completed'?'Dovršeno':'Aktivno')+'</div>';list.appendChild(div)}}
function togglePause(){if(gameState==='playing'){$('pause-menu').style.display='flex';gameState='paused'}else if(gameState==='paused'){resumeGame()}}
window.addEventListener('keydown',e=>{keys[e.code]=true;if(gameState==='playing'){if(e.code==='KeyE')interact();if(e.code==='Escape')togglePause();if(e.code==='Tab'){e.preventDefault();openMissions()}if(e.code==='KeyM')openMap()}else if(gameState==='map'&&e.code==='Escape'){closeMap()}else if(gameState==='missions'&&e.code==='Escape'){closeMissions()}});
window.addEventListener('keyup',e=>keys[e.code]=false);
[$('map-panel'),$('missions-panel')].forEach(o=>{o.addEventListener('click',e=>{if(e.target===o){o===$('map-panel')?closeMap():closeMissions()}})});
window.startGame=startGame;window.showCredits=showCredits;window.hideCredits=hideCredits;window.resumeGame=resumeGame;window.openMap=openMap;window.openMissions=openMissions;window.toMainMenu=toMainMenu;window.closeMap=closeMap;window.closeMigrations=closeMigrations;window.showNotification=showNotification;
</script>
</body>
